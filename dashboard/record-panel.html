<!DOCTYPE html>
<html lang="en" data-hq-theme="dark">
<head>
<meta charset="UTF-8" />
<!-- v5 clean pass (S0/S2): v5's CSP, unchanged. MediaRecorder + Blob.arrayBuffer() need no
     blob: URL and nothing here loads remote code; the page has no inline script. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; media-src 'self' file: blob:; font-src 'self'; connect-src 'self'">
<title>Record</title>
<!-- v5: theme first, so the tokens below resolve against the right palette on first paint -->
<script src="satellite-theme.js"></script>
<link rel="stylesheet" href="../dashboard-v5/styles/tokens.css" />
<style>
  /* Recorder satellite, per "WorkspaceHQ v3 Satellites" › recorder · setup → live.
     The window is transparent; screen-capture.js sizes it per mode (setup 340×180,
     live 230×44), so each surface has the window's size and sits at its top-left. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: var(--term); font-size: 12px; color: var(--text);
    -webkit-user-select: none; user-select: none;
  }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 1px solid var(--gold); outline-offset: 1px; }
  [hidden] { display: none !important; }

  /* ---- setup card ---- */
  .card {
    position: absolute; left: 0; top: 0; width: 340px; height: 180px;
    display: flex; flex-direction: column; gap: 7px;
    padding: 10px 12px;
    background: var(--card); border: 1px solid var(--frame); border-radius: 12px;
    -webkit-app-region: drag;
  }
  .card button, .card select { -webkit-app-region: no-drag; }
  .seg { display: flex; gap: 6px; }
  .seg button {
    flex: 1; height: 28px; border-radius: 8px;
    border: 1px solid var(--frame); background: transparent; color: var(--muted);
  }
  .seg button[aria-checked="true"] { border-color: var(--gold); color: var(--accent-text); }
  .seg button:disabled { color: var(--faint); opacity: .6; }
  .seg .x { flex: 0 0 28px; color: var(--faint); border-color: transparent; }
  .seg .x:hover { color: var(--text); border-color: var(--frame); }
  .srcrow { display: flex; gap: 6px; }
  .srcrow select {
    flex: 1; min-width: 0; height: 26px; padding: 0 6px;
    border: 1px solid var(--frame); border-radius: 8px;
    background: var(--card-hi); color: var(--text);
  }
  .srcrow select option { background: var(--card-hi); color: var(--text); }
  .icon {
    flex: 0 0 26px; height: 26px; border-radius: 8px;
    border: 1px solid var(--frame); background: transparent; color: var(--muted);
  }
  .icon:hover:not(:disabled) { color: var(--text); border-color: var(--frame-hi); }
  .opts { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .opts .sep { color: var(--faint); }
  .opts button {
    background: none; border: 0; padding: 0; color: var(--muted);
    text-decoration: underline dotted var(--frame-hi); text-underline-offset: 3px;
  }
  .opts button[aria-pressed="true"] { color: var(--text); }
  .opts button:disabled { opacity: .5; }
  .start {
    height: 32px; border-radius: 8px; flex: none;
    background: color-mix(in oklab, var(--red) 14%, transparent);
    border: 1px solid color-mix(in oklab, var(--red) 50%, transparent);
    color: var(--red);
  }
  .start:hover:not(:disabled) { background: color-mix(in oklab, var(--red) 22%, transparent); }
  .start:disabled { color: var(--faint); border-color: var(--frame); background: transparent; }
  .status { display: flex; align-items: center; gap: 6px; min-height: 14px; font-size: 11px; color: var(--faint); }
  #statusText { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.err #statusText { color: var(--red); }
  body.warn #statusText { color: var(--orange); }
  body.saved #statusText { color: var(--green); }
  .link { background: none; border: 0; padding: 0; color: var(--link); font-size: 11px; -webkit-app-region: no-drag; }
  .link:hover { color: var(--link-hover); }

  /* ---- live pill ---- */
  .pill {
    position: absolute; left: 0; top: 0; width: 230px; height: 44px;
    display: flex; align-items: center; gap: 10px;
    padding: 0 6px 0 16px;
    background: var(--card); border: 1px solid var(--red); border-radius: 999px;
    -webkit-app-region: drag;
  }
  .pill button { -webkit-app-region: no-drag; }
  .pill .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--red); animation: hq-rec-blink 1.2s ease-in-out infinite; }
  .pill .time { flex: 1; min-width: 0; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill .round {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; font-size: 11px; line-height: 1;
  }
  #btnPause { border: 1px solid var(--frame); background: transparent; color: var(--text); }
  #btnPause:hover:not(:disabled) { border-color: var(--frame-hi); }
  #btnStop { border: 0; background: var(--red); color: #fff; }
  .pill button:disabled { opacity: .45; }
  body.paused .pill { border-color: var(--frame-hi); }
  body.paused .pill .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); animation: none; }
  body.paused .pill .time { color: var(--muted); }
  body.finishing .pill .dot { animation: none; opacity: .5; }
  [data-hq-reduce] .pill .dot { animation: none; }
  @keyframes hq-rec-blink { 50% { opacity: .35; } }
</style>
</head>
<body>
  <!-- v5: setup card — kind · source · audio · start (Satellites › recorder, left) -->
  <section id="setup" class="card" aria-label="Recorder setup">
    <div class="seg" role="radiogroup" aria-label="What to record">
      <button type="button" data-kind="window" role="radio" aria-checked="false">window</button>
      <button type="button" data-kind="region" role="radio" aria-checked="false" disabled title="Region recording isn't built yet — record a window or a whole screen">region</button>
      <button type="button" data-kind="screen" role="radio" aria-checked="true">screen</button>
      <button type="button" id="btnHide" class="x" title="Hide the recorder (Esc)" aria-label="Hide the recorder">×</button>
    </div>
    <div class="srcrow">
      <select id="source" aria-label="Source"></select>
      <button type="button" id="btnRefresh" class="icon" title="Rescan sources" aria-label="Rescan sources">↻</button>
    </div>
    <div class="opts">
      <button type="button" id="optMic" aria-pressed="false" title="Include the default microphone">mic off</button>
      <span class="sep">·</span>
      <button type="button" id="optSys" aria-pressed="false" title="Include system audio (loopback)">system audio off</button>
      <span class="sep">·</span>
      <span>30 fps</span>
    </div>
    <button type="button" id="btnRec" class="start" disabled title="Pick a source first">● start</button>
    <div class="status" role="status" aria-live="polite">
      <span id="statusText">Idle</span>
      <button type="button" id="btnReveal" class="link" hidden>reveal</button>
    </div>
  </section>

  <!-- v5: live pill — dot · elapsed (paused time excluded) · pause/resume · stop (Satellites › recorder, right) -->
  <section id="live" class="pill" aria-label="Recording" hidden>
    <span class="dot" aria-hidden="true"></span>
    <span id="timer" class="time" role="timer">00:00</span>
    <button type="button" id="btnPause" class="round" title="Pause" aria-label="Pause">❚❚</button>
    <button type="button" id="btnStop" class="round" title="Stop and save" aria-label="Stop and save">■</button>
  </section>
  <script src="record-panel.js"></script>
</body>
</html>
