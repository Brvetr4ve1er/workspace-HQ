<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- v5: v5's CSP. The palette loads only its own files (tokens.css + fonts,
     satellite-theme.js, summon.js); its script moved out to summon.js. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; media-src 'self' file: blob:; font-src 'self'; connect-src 'self'" />
<title>Summon</title>
<!-- v5: theme first: data-hq-theme / data-hq-reduce on <html> from hq.uiPrefs (get + push) -->
<script src="../satellite-theme.js"></script>
<!-- v5: shared palette + IBM Plex Mono (tokens only, no html/body rules) -->
<link rel="stylesheet" href="../../dashboard-v5/styles/tokens.css" />
<style>
  /* v5: restyled per the Satellites design (quick-run palette: card-hi, gold
     frame, ink input with a gold › prompt). No local palette: every colour is a
     token, so the theme follows hq.uiPrefs live. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:transparent; overflow:hidden; height:100%; }
  #cap { height:100vh; display:flex; flex-direction:column; overflow:hidden;
         background:var(--card-hi); border:1px solid var(--gold); border-radius:14px;
         font-family:var(--term); color:var(--text); -webkit-app-region:drag; }
  .row { padding:12px 12px 10px; }
  .field { height:42px; display:flex; align-items:center; gap:8px; padding:0 12px;
           border-radius:8px; background:var(--ink); border:1px solid var(--frame); }
  .field:focus-within { border-color:var(--frame-hi); }
  .p { color:var(--gold); font-size:15px; }
  input { -webkit-app-region:no-drag; flex:1; min-width:0; background:transparent; border:0; outline:none;
          color:var(--text); font-family:var(--term); font-size:15px; caret-color:var(--gold); }
  input::placeholder { color:var(--faint); }
  .ft { margin-top:auto; padding:8px 14px; border-top:1px solid var(--frame); font-size:11px; color:var(--faint);
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ft .ai { color:var(--purple); }
  [data-hq-reduce] * { animation:none !important; transition:none !important; }
</style>
</head>
<body>
  <!-- v5: restyled palette; the grammar moved from the 9px label into the placeholder -->
  <div id="cap">
    <div class="row">
      <label class="field"><span class="p" aria-hidden="true">›</span><input id="in" autofocus spellcheck="false" autocomplete="off" aria-label="Summon a widget" placeholder="note … · timer 25 · quest · hp · lib" /></label>
    </div>
    <!-- v5: free text spends Claude quota; say so before Enter (design: purple = ai only) -->
    <div class="ft">anything new → <span class="ai">✦ claude writes it</span> · uses quota · esc close</div>
  </div>
  <!-- v5: the inline script moved here (script-src 'self') -->
  <script src="./summon.js"></script>
</body>
</html>
