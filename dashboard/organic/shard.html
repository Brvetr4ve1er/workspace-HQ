<!DOCTYPE html>
<html lang="en" data-hq-theme="dark">
<head>
<meta charset="UTF-8" />
<!-- Conjured widgets run inline-only: no remote scripts, styles, images, or network. -->
<!-- v5: + style-src 'self' and font-src 'self' so the shared tokens.css and its local
     IBM Plex Mono load. Scripts stay inline-only and default-src stays 'none'. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src 'self';" />
<title>HQ Shard</title>
<!-- v5: theme from the shard preload's read-only hq.uiPrefs (get + push). Inline
     because script-src is inline-only here, so ../satellite-theme.js can't load;
     same rules as that file: an OS guess until main answers, a push beats a stale get. -->
<script>
  (function (h, api) {
    var pushed = false;
    function apply(p) {
      if (!p || typeof p !== 'object') return;
      h.setAttribute('data-hq-theme', p.resolved === 'light' ? 'light' : 'dark');
      if (p.reduceMotion) h.setAttribute('data-hq-reduce', '1'); else h.removeAttribute('data-hq-reduce');
    }
    try { if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) h.setAttribute('data-hq-theme', 'light'); } catch (e) {}
    if (!api) return;
    try { api.on(function (p) { pushed = true; apply(p); }); } catch (e) {}
    try { api.get().then(function (p) { if (!pushed) apply(p); }, function () {}); } catch (e) {}
  })(document.documentElement, window.hq && window.hq.uiPrefs);
</script>
<!-- v5: shared palette + IBM Plex Mono (tokens only, no html/body rules) -->
<link rel="stylesheet" href="../../dashboard-v5/styles/tokens.css" />
<style>
  /* v5: restyled per the Satellites design ("Desktop shards"): one frame for every
     widget — 14px radius, hairline border (gold = the quest to do, purple = ai only),
     a "╭─ kind" label, lowercase actions. Every colour is a token, so the theme
     follows hq.uiPrefs live. The design's var(--panel) + backdrop blur can't blur
     the desktop behind a transparent window, so the frame uses the more opaque
     var(--card) to stay legible over any wallpaper. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:transparent; overflow:hidden; height:100%; }
  #shard { height:100%; display:flex; flex-direction:column; overflow:hidden;
           border:1px solid var(--shb, var(--frame)); border-radius:14px; background:var(--card);
           font-family:var(--term); font-size:13px; color:var(--text);
           animation: sprout .28s cubic-bezier(.18,1.4,.4,1); }
  @keyframes sprout { 0% { transform:scale(.7); opacity:0; } 100% { transform:scale(1); opacity:1; } }
  /* header: drag region + kind label + subtitle + ↻ / ✕ */
  .hd { display:flex; align-items:center; gap:8px; min-height:30px; padding:8px 8px 0 14px; -webkit-app-region:drag;
        font-size:11px; color:var(--faint); white-space:nowrap; }
  .hd .k { flex:none; }
  .hd .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; color:var(--muted); }
  .hd .ai { flex:none; font-size:10px; padding:1px 6px; border-radius:999px; border:1px solid var(--purple); color:var(--purple); }
  .hd .x { -webkit-app-region:no-drag; flex:none; width:22px; height:22px; display:grid; place-items:center;
           background:transparent; border:0; border-radius:6px; color:var(--faint); cursor:pointer; font-size:12px; }
  .hd .x:hover { color:var(--text); background:var(--ink); }
  .hd #x:hover { color:var(--red); }
  .bd { flex:1; min-height:0; padding:8px 14px 14px; overflow:auto; }
  button { font-family:var(--term); cursor:pointer; }
  .btn { height:28px; padding:0 10px; border-radius:7px; font-size:12px; border:1px solid var(--frame);
         background:transparent; color:var(--text); }
  .btn:hover { border-color:var(--frame-hi); }
  .btn.pri { background:var(--gold); border-color:var(--gold); color:#1a0f0a; font-weight:600; }
  .btn.pri:hover { background:var(--gold-2); border-color:var(--gold-2); }
  /* frame-only (conjured widgets keep the browser defaults they were written against) */
  :focus-visible:not(#custom-host *) { outline:2px solid var(--gold); outline-offset:2px; }
  .bd::-webkit-scrollbar, #custom-host::-webkit-scrollbar { width:8px; height:8px; }
  .bd::-webkit-scrollbar-thumb, #custom-host::-webkit-scrollbar-thumb { background:var(--frame); border-radius:4px; }
  .bd::-webkit-scrollbar-track, #custom-host::-webkit-scrollbar-track { background:transparent; }

  /* note */
  .note-ta { display:block; width:100%; height:100%; background:transparent; border:0; outline:none; resize:none;
             color:var(--text); font-family:var(--term); font-size:13px; line-height:1.5; }
  .note-ta::placeholder { color:var(--faint); }
  /* timer */
  .t-time { font-size:34px; text-align:center; letter-spacing:1px; color:var(--text); line-height:1.1; font-variant-numeric:tabular-nums; }
  .t-time.done { color:var(--green); animation: flash .5s steps(1) 6; }
  @keyframes flash { 50% { color:var(--gold); } }
  .t-row { display:flex; gap:6px; justify-content:center; margin-top:8px; }
  /* quest */
  .q-title { font-size:15px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .q-meta { margin-top:4px; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .q-meta .tier-red { color:var(--red); } .q-meta .tier-orange { color:var(--orange); } .q-meta .tier-yellow { color:var(--yellow); }
  .q-row { display:flex; gap:6px; margin-top:12px; }
  /* vitals (hp) */
  .hp-line { display:flex; align-items:center; gap:10px; margin-top:2px; }
  .hp-lv { font-size:16px; line-height:1.2; }
  .hp-bar { flex:1; height:6px; background:var(--ink); border:1px solid var(--frame); border-radius:3px; overflow:hidden; }
  .hp-bar i { display:block; height:100%; background:var(--gold); }
  .hp-pct { font-size:12px; color:var(--muted); }
  .hp-sub { margin-top:8px; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hp-sub b { font-weight:400; color:var(--text); }
  .hp-sub .est { color:var(--faint); }
  /* xp drip: no frame, a small pill that rises and fades (click-through) */
  #shard.drip-mode { background:transparent; border:0; }
  #shard.drip-mode .hd { display:none; }
  #shard.drip-mode .bd { padding:0; overflow:hidden; }
  .drip { display:flex; align-items:center; justify-content:center; height:100%; animation: rise 5.6s ease-out forwards; }
  .drip span { max-width:100%; padding:6px 14px; border-radius:999px; background:var(--card-hi); border:1px solid var(--gold);
               color:var(--accent-text); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @keyframes rise { 0% { transform:translateY(8px); opacity:0; } 12% { opacity:1; transform:none; } 80% { opacity:1; } 100% { opacity:0; transform:translateY(-10px); } }
  /* conjuring */
  .conj { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:10px; color:var(--muted); font-size:12.5px; text-align:center; padding:0 14px; }
  .conj .sub { color:var(--faint); }
  .orb { width:24px; height:24px; border-radius:50%; border:2px solid var(--frame); border-top-color:var(--purple); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .err { color:var(--red); font-size:12.5px; }
  #custom-host { height:100%; overflow:auto; }
  /* library browser */
  .lib-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--frame); }
  .lib-p { flex:1; min-width:0; font-size:12.5px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lib-d { font-size:11px; color:var(--faint); }
  .lib-row button { height:24px; min-width:28px; padding:0 8px; border-radius:7px; border:1px solid var(--frame); background:transparent; color:var(--muted); font-size:11px; }
  .lib-row .go { border-color:var(--gold); color:var(--accent-text); }
  .lib-row .go:hover { background:var(--gold); color:#1a0f0a; }
  .lib-row .del:hover { border-color:var(--red); color:var(--red); }
  .lib-empty { padding:18px 10px; text-align:center; color:var(--faint); font-size:12px; line-height:1.6; }
  .lib-empty b { font-weight:400; color:var(--accent-text); }

  /* reduced motion (hq.uiPrefs or the OS): the frame's own animations only —
     conjured widgets' CSS stays as Claude wrote it */
  [data-hq-reduce] #shard, [data-hq-reduce] .t-time.done, [data-hq-reduce] .drip, [data-hq-reduce] .orb { animation:none !important; }
  @media (prefers-reduced-motion: reduce) { #shard, .t-time.done, .drip, .orb { animation:none !important; } }
</style>
</head>
<body>
  <div id="shard">
    <!-- v5: "╭─ kind" label, subtitle, ✦ ai pill (conjured only), then ↻ / ✕ -->
    <div class="hd"><span class="k">╭─ <span id="hd-k">shard</span></span><span class="t" id="hd-t"></span><span class="ai" id="ai" title="written by Claude" style="display:none">✦ ai</span><button class="x" id="rg" title="regenerate (Claude rewrites this widget · uses quota)" style="display:none">↻</button><button class="x" id="x" title="dismiss">✕</button></div>
    <div class="bd" id="bd"></div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  let CFG = null, saveT = null;
  $('x').onclick = () => window.hq.shardClose();
  $('rg').onclick = () => window.hq.shardRegen();

  function render(cfg) {
    CFG = cfg;
    const p = cfg.payload || {};
    const bd = $('bd');
    const shard = $('shard');
    // v5: label + frame accent per kind (gold = the quest to do, purple = ai only)
    const kinds = { note: ['note', ''], timer: ['timer', ''], quest: ['top quest', 'var(--gold)'], hp: ['vitals', ''], 'xp-drip': ['', ''], custom: ['conjured', 'var(--purple)'], library: ['library', ''] };
    const [label, accent] = kinds[cfg.widget] || ['shard', ''];
    $('hd-k').textContent = label;
    $('hd-t').textContent = '';
    if (accent) shard.style.setProperty('--shb', accent); else shard.style.removeProperty('--shb');
    // v5: Claude-written HTML was generated for a dark card (main's conjure prompt asks
    // for one), so a conjured shard keeps the dark token set in either theme.
    if (cfg.widget === 'custom') shard.setAttribute('data-hq-theme', 'dark'); else shard.removeAttribute('data-hq-theme');
    $('ai').style.display = cfg.widget === 'custom' ? '' : 'none';
    // ↻ only makes sense on a finished conjure — it asks Claude to rewrite in place
    $('rg').style.display = (cfg.widget === 'custom' && p.status === 'ready' && p.prompt) ? '' : 'none';

    if (cfg.widget === 'note') {
      bd.innerHTML = '<textarea class="note-ta" spellcheck="false" placeholder="type a note · saved as you type"></textarea>';
      const ta = bd.querySelector('textarea');
      ta.value = p.text || '';
      ta.oninput = () => { clearTimeout(saveT); saveT = setTimeout(() => window.hq.shardSave({ text: ta.value }), 500); };

    } else if (cfg.widget === 'timer') {
      let left = (p.minutes || 25) * 60, run = true;
      bd.innerHTML = '<div class="t-time" id="tt"></div><div class="t-row"><button class="btn" id="tp">pause</button><button class="btn" id="tr">reset</button></div>';
      const paint = () => { $('tt').textContent = String((left / 60) | 0).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'); };
      paint();
      const iv = setInterval(() => {
        if (!run) return;
        if (--left <= 0) { left = 0; run = false; $('tt').classList.add('done'); beep(); }
        paint();
      }, 1000);
      $('tp').onclick = () => { run = !run; $('tp').textContent = run ? 'pause' : 'resume'; };
      $('tr').onclick = () => { left = (p.minutes || 25) * 60; run = true; $('tt').classList.remove('done'); $('tp').textContent = 'pause'; paint(); };

    } else if (cfg.widget === 'quest') {
      // v5: a snapshot of the top quest at summon time (open HQ for the live list)
      $('hd-t').textContent = 'as of last scan';
      const tier = ['red', 'orange', 'yellow'].includes(p.tier) ? p.tier : '';
      bd.innerHTML = `<div class="q-title">${esc(p.title || 'All clear ✓')}</div>
        <div class="q-meta">${p.project ? esc(p.project) + ' · ' : ''}+${esc(p.xp || 0)} xp${tier ? ' · <span class="tier-' + tier + '">' + tier + '</span>' : ''}</div>
        <div class="q-row"><button class="btn pri" id="qd">✓ done</button><button class="btn" id="qo">open hq</button></div>`;
      $('qd').onclick = () => { window.hq.markQuestDone(p.id); window.hq.shardClose(); };
      $('qo').onclick = () => window.hq.showMain();

    } else if (cfg.widget === 'hp') {
      // v5: a snapshot from the last scan; health is the scanner's estimate, the streak counts scan days
      $('hd-t').textContent = 'as of last scan';
      const xpP = Math.max(0, Math.min(100, Math.round(+p.xpPct || 0))), hpP = Math.max(0, Math.min(100, Math.round(+p.hp || 0)));
      const hpC = hpP < 40 ? 'var(--red)' : hpP < 70 ? 'var(--orange)' : 'var(--green)';
      const lv = Number.isFinite(+p.level) && p.level !== null && p.level !== '' ? +p.level : null;
      const streak = Number.isFinite(+p.streak) ? +p.streak : 0;
      bd.innerHTML = `<div class="hp-line"><span class="hp-lv">lv ${lv === null ? '?' : lv}</span>
          <div class="hp-bar" title="${xpP}% of the way to the next level"><i style="width:${xpP}%"></i></div><span class="hp-pct">${xpP}%</span></div>
        <div class="hp-sub">health <b style="color:${hpC}">${hpP}</b> <span class="est">est.</span> · ${streak} scan day${streak === 1 ? '' : 's'}</div>`;

    } else if (cfg.widget === 'xp-drip') {
      // v5: frameless via a class (was inline style overrides)
      shard.classList.add('drip-mode');
      bd.innerHTML = `<div class="drip"><span>✨ ${esc(p.text || '+XP')}</span></div>`;

    } else if (cfg.widget === 'custom') {
      $('hd-t').textContent = (p.prompt || '').slice(0, 34);
      if (p.status === 'conjuring') {
        bd.innerHTML = '<div class="conj"><div class="orb"></div><div>conjuring widget…<br><span class="sub">Claude is writing it for you</span></div></div>';
      } else if (p.status === 'error') {
        bd.innerHTML = `<div class="conj err">✖ ${esc(p.error || 'failed')}</div>`;
      } else if (p.status === 'ready' && p.html) {
        bd.innerHTML = '<div id="custom-host"></div>';
        mountCustom(bd.querySelector('#custom-host'), p.html);
      }

    } else if (cfg.widget === 'library') {
      const items = p.items || [];
      if (!items.length) {
        // v5: one break only; the fixed <br>s wrapped mid-phrase at 380px in Plex Mono
        bd.innerHTML = '<div class="lib-empty">No creations yet.<br>Summon anything (<b>Ctrl+Alt+G</b>) and it lands here — then re-summon it instantly by typing its name.</div>';
      } else {
        bd.innerHTML = '';
        items.slice().reverse().forEach((it) => {
          const row = document.createElement('div');
          row.className = 'lib-row';
          row.innerHTML = `<div class="lib-p" title="${esc(it.prompt)}">${esc(it.prompt)}</div>
            <span class="lib-d">${esc((it.updated_at || '').slice(0, 10))}</span>
            <button class="go" title="summon it here">▶</button><button class="del" title="delete from the library">✕</button>`;
          row.querySelector('.go').onclick = () => window.hq.shardLibSpawn(it.key);
          row.querySelector('.del').onclick = () => window.hq.shardLibDelete(it.key);
          bd.appendChild(row);
        });
      }
    }
  }

  // innerHTML never executes <script> tags — re-create them so conjured widgets
  // are actually interactive (CSP still confines everything to inline/local).
  function mountCustom(host, html) {
    host.innerHTML = html;
    host.querySelectorAll('script').forEach((old) => {
      const s = document.createElement('script');
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
  }

  function esc(s) { return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  function beep() {
    try {
      const ctx = new AudioContext(); const t0 = ctx.currentTime;
      [[880, 0], [1175, .14], [1568, .28]].forEach(([f, at]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'square'; o.frequency.value = f;
        g.gain.setValueAtTime(.04, t0 + at); g.gain.exponentialRampToValueAtTime(.0001, t0 + at + .25);
        o.connect(g); g.connect(ctx.destination); o.start(t0 + at); o.stop(t0 + at + .3);
      });
    } catch {}
  }

  window.hq.onShardInit(render);
</script>
</body>
</html>
