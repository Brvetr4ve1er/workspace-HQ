<!DOCTYPE html>
<html lang="en" data-hq-theme="dark">
<head>
<meta charset="UTF-8" />
<!-- v5 clean pass (S0/S3): v5's CSP, unchanged. img-src data: is what the frozen desktop
     needs (main hands it over as a PNG data: URL); the script moved to snip-overlay.js. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; media-src 'self' file: blob:; font-src 'self'; connect-src 'self'">
<title>WorkspaceHQ Snip Overlay</title>
<!-- v5: theme first, so the tokens below resolve against the right palette on first paint -->
<script src="satellite-theme.js"></script>
<link rel="stylesheet" href="../dashboard-v5/styles/tokens.css" />
<style>
  /* Snip overlay, per "WorkspaceHQ v3 Satellites" › snip · post-capture bar.
     Layer stack:
       #frozen          — the real desktop pixels (full-bleed <img>)
       #scrim           — dims everything; a rect gets clipped out of it during drag
       #selection-frame — thin accent outline around the "hole"
       #dim-chip        — W × H readout (follows the cursor while dragging, then sits
                          above the selection)
       #hud             — top-left: which display, which keys
       #bar / #picker   — after a selection: save · copy · ✦ send to claude · esc
     The scrim is what makes the selection feel selected — bright inside, dim outside —
     while one background image supplies both regions, so brightness never drifts. */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: transparent;
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
    font-family: var(--term);
    color: var(--text);
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 1px solid var(--gold); outline-offset: 1px; }
  [hidden] { display: none !important; }

  #frozen {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    /* Native pixels scaled to CSS pixels; keep it crisp so the preview matches the crop. */
    image-rendering: -webkit-optimize-contrast;
    pointer-events: none;
    /* Until the frozen bitmap arrives, a solid ground so a click never flashes the desktop. */
    background: var(--ink);
  }

  #scrim {
    position: absolute; inset: 0;
    background: var(--scrim);
    pointer-events: none;
    transition: none;
  }

  #selection-frame {
    position: absolute;
    display: none;
    outline: 1px solid var(--gold);
    pointer-events: none;
  }

  #dim-chip {
    position: absolute;
    display: none;
    color: var(--accent-text);
    font-size: 11px;
    white-space: nowrap;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  }
  #dim-chip.dragging {
    padding: 3px 7px;
    background: var(--card-hi);
    border: 1px solid var(--frame);
    border-radius: 6px;
    text-shadow: none;
  }

  /* Top-left ambient HUD — which display, which keys. Never shows scan/session text. */
  #hud {
    position: absolute;
    top: 18px; left: 20px;
    padding: 9px 12px;
    background: var(--card);
    border: 1px solid var(--frame);
    border-radius: 10px;
    color: var(--muted);
    font-size: 11px;
    pointer-events: none;
    opacity: 0.94;
  }
  #hud .row + .row { margin-top: 4px; }
  #hud .k { color: var(--accent-text); }
  #hud .sep { color: var(--faint); margin: 0 5px; }
  #hud .badge { color: var(--text); }
  body[data-kind="full"] #hud { opacity: 0.65; }
  body.has-bar #hud { opacity: 0.5; }

  /* v5: the post-capture bar (Satellites › snip) */
  #bar {
    position: absolute;
    display: flex; gap: 4px;
    padding: 4px;
    background: var(--card-hi);
    border: 1px solid var(--frame);
    border-radius: 10px;
    font-size: 13px;
    cursor: default;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  #bar button {
    height: 28px; padding: 0 10px;
    display: grid; place-items: center;
    border-radius: 7px;
    border: 1px solid var(--frame);
    background: transparent;
    color: var(--text);
    white-space: nowrap;
  }
  #bar button:hover:not(:disabled) { border-color: var(--frame-hi); }
  #bar .primary { background: var(--gold); border-color: var(--gold); color: #1a0f0a; font-weight: 600; }
  #bar .primary:hover { background: var(--gold-2); border-color: var(--gold-2); }
  #bar .ghost { border-color: transparent; color: var(--faint); }
  #bar .ghost:hover { color: var(--text); border-color: transparent; }
  #bar button:disabled { color: var(--faint); border-color: var(--frame); opacity: .6; }
  #bar button[aria-expanded="true"] { border-color: var(--gold); color: var(--accent-text); }

  /* v5: the send-to-Claude project picker */
  #picker {
    position: absolute;
    min-width: 220px; max-width: 360px; max-height: 260px;
    display: flex; flex-direction: column;
    background: var(--card-hi);
    border: 1px solid var(--frame);
    border-radius: 10px;
    padding: 4px;
    font-size: 12px;
    cursor: default;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  #picker .hd { padding: 6px 8px 4px; color: var(--faint); font-size: 11px; }
  #picker .list { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  #picker .item {
    text-align: left; padding: 6px 8px; border-radius: 7px;
    border: 1px solid transparent; background: transparent; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #picker .item:hover, #picker .item:focus-visible { border-color: var(--gold); color: var(--accent-text); outline: none; }

  /* Shutter cue, painted just before the commit goes to main. */
  #flash {
    position: absolute; inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 90ms ease-out;
  }
  #flash.on { opacity: 0.55; }
  [data-hq-reduce] #flash { transition: none; }
</style>
</head>
<body>
  <img id="frozen" alt="" draggable="false" />
  <div id="scrim"></div>
  <div id="selection-frame"></div>
  <div id="dim-chip"><b>0</b> × <b>0</b></div>
  <div id="hud">
    <div class="row">
      <span class="badge" id="hud-display">display —</span>
      <span class="sep">·</span>
      <span id="hud-kind">region</span>
    </div>
    <div class="row">
      <span class="k">drag</span> select <span class="sep">·</span>
      <span class="k">space</span> full screen <span class="sep">·</span>
      <span class="k">enter</span> save + copy <span class="sep">·</span>
      <span class="k">esc</span> cancel
    </div>
  </div>
  <!-- v5: post-capture bar — save · copy · ✦ send to claude · esc (Enter = save + copy) -->
  <div id="bar" role="toolbar" aria-label="Snip actions" hidden>
    <button type="button" id="btnSave" class="primary" title="S — save the file (Enter: save + copy)">save</button>
    <button type="button" id="btnCopy" title="C — copy to the clipboard only, no file">copy</button>
    <button type="button" id="btnClaude" aria-haspopup="menu" aria-expanded="false">✦ send to claude</button>
    <button type="button" id="btnEsc" class="ghost" title="Esc — cancel">esc</button>
  </div>
  <!-- v5: project picker for send to claude -->
  <div id="picker" role="menu" aria-label="Send to Claude in project" hidden>
    <div class="hd">open claude in…</div>
    <div class="list" id="pickerList"></div>
  </div>
  <div id="flash"></div>
  <script src="snip-overlay.js"></script>
</body>
</html>
