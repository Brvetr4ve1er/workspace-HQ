<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- v5 clean pass S0/S4: v5's CSP. The page script lives in mini.js now (no inline
     script); style-src keeps 'unsafe-inline' for this <style> block. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; media-src 'self' file: blob:; font-src 'self'; connect-src 'self'">
<title>WorkspaceHQ HUD</title>
<!-- first: puts data-hq-theme / data-hq-reduce on <html> from main's ui-prefs before paint -->
<script src="./satellite-theme.js"></script>
<link rel="stylesheet" href="../dashboard-v5/styles/tokens.css" />
<style>
  /* Satellites design · "mini hud · always on top". The window is 286×196,
     transparent and frameless (main.js createMiniWindow); the card fills it. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  body { font-family: var(--term); color: var(--text); font-size: 12px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-app-region: no-drag; }
  button:focus-visible { outline: 1px solid var(--gold); outline-offset: 1px; }

  #hud {
    -webkit-app-region: drag;            /* grab anywhere empty to move */
    position: relative; height: 100vh;
    display: flex; flex-direction: column; gap: 8px;
    padding: 11px 13px;
    background: var(--card); border: 1px solid var(--frame); border-radius: 12px;
    overflow: hidden;
  }
  .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .flex { flex: 1; }

  .head { font-size: 11px; color: var(--faint); }
  .dot { width: 7px; height: 7px; border-radius: 2px; flex: none; background: var(--faint); }
  .dot.red { background: var(--red); } .dot.orange { background: var(--orange); }
  .dot.yellow { background: var(--yellow); } .dot.green { background: var(--green); }
  .head .lbl { flex: 1; }
  #qxp { color: var(--accent-text); }
  #qxp:empty { display: none; }
  .x { color: var(--faint); font-size: 15px; line-height: 1; padding: 0 3px; border-radius: 5px; }
  .x:hover { color: var(--red); background: color-mix(in oklab, var(--red) 14%, transparent); }

  .next { display: block; width: calc(100% + 4px); text-align: left; font-size: 14px; line-height: 1.3; color: var(--text); padding: 1px 2px; margin: -1px -2px; border-radius: 6px; }
  #qtitle { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .next:hover { color: var(--accent-text); }

  .counts { gap: 10px; font-size: 12px; color: var(--muted); }
  .cnt { padding: 1px 4px; margin: 0 -4px; border-radius: 5px; white-space: nowrap; }
  .cnt b { font-weight: 400; }
  .cnt.red { color: var(--red); } .cnt.orange { color: var(--orange); } .cnt.quiet { color: var(--faint); }
  .cnt:hover { background: color-mix(in oklab, var(--gold) 12%, transparent); }
  #lv { color: var(--accent-text); white-space: nowrap; }

  .spells { gap: 5px; }
  .spell {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 5px;
    height: 24px; padding: 0 7px; border-radius: 7px;
    border: 1px solid var(--frame); background: var(--ink); font-size: 11px;
  }
  .spell:hover { border-color: var(--gold); }
  .spell .si { font-size: 12px; flex: none; }
  .spell .sn { flex: 1; min-width: 0; text-align: left; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spell.busy { border-color: var(--gold); }
  .spell.busy .si { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .vitals { gap: 5px; font-size: 10px; color: var(--faint); margin-top: auto; }
  .vitals b { font-weight: 400; color: var(--muted); min-width: 26px; }
  .vitals b.red { color: var(--red); } .vitals b.orange { color: var(--orange); } .vitals b.green { color: var(--green); }
  .bar { flex: 1; min-width: 20px; height: 4px; border-radius: 2px; background: var(--ink); box-shadow: inset 0 0 0 1px var(--frame); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--muted); transition: width .4s; }
  .bar i.hot { background: var(--red); }
  .srv { color: var(--red); font-size: 10px; padding: 0 4px; border-radius: 5px; white-space: nowrap; }
  .srv b { color: var(--red); min-width: 0; }
  .srv:hover { background: color-mix(in oklab, var(--red) 14%, transparent); }

  .note {
    position: absolute; left: 10px; right: 10px; bottom: 8px;
    padding: 4px 8px; border-radius: 7px; font-size: 10.5px; line-height: 1.3;
    background: var(--card-hi); border: 1px solid var(--frame); color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .note.red { color: var(--red); border-color: color-mix(in oklab, var(--red) 50%, transparent); }

  [data-hq-reduce] *, [data-hq-reduce] *::before, [data-hq-reduce] *::after { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <div id="hud">
    <div class="row head">
      <span class="dot quiet" id="qdot"></span>
      <span class="lbl">next action</span>
      <span id="qxp"></span>
      <button class="x" id="close" type="button" title="Hide HUD (re-show from tray)" aria-label="Hide HUD">×</button>
    </div>
    <button class="next" id="quest" type="button" title="Open WorkspaceHQ"><span id="qtitle">Loading…</span></button>
    <div class="row counts">
      <button class="cnt quiet" id="c-secrets" type="button">⚿ <b>—</b></button>
      <button class="cnt quiet" id="c-uncommitted" type="button">● <b>—</b></button>
      <button class="cnt quiet" id="c-unpushed" type="button">↑ <b>—</b></button>
      <span class="flex"></span>
      <span id="lv">lv – · – xp</span>
    </div>
    <div class="row spells" id="spells" hidden></div>
    <div class="row vitals">
      <span>hp</span><b id="hp">–</b>
      <span>cpu</span><span class="bar"><i id="cpufill"></i></span><b id="cpu">–</b>
      <span>ram</span><span class="bar"><i id="ramfill"></i></span><b id="ram">–</b>
      <button class="srv" id="killsrv" type="button" title="Stop running dev servers" hidden>■ <b id="srvn">0</b></button>
    </div>
    <div class="note" id="note" role="status" hidden></div>
  </div>
  <script src="./mini.js"></script>
</body>
</html>
