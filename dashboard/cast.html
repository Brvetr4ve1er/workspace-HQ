<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- v5 clean pass S0/S5: v5's CSP. The page script lives in cast.js now (no inline
     script); style-src keeps 'unsafe-inline' for this <style> block. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; media-src 'self' file: blob:; font-src 'self'; connect-src 'self'">
<title>Quick-run</title>
<!-- first: puts data-hq-theme / data-hq-reduce on <html> from main's ui-prefs before paint -->
<script src="./satellite-theme.js"></script>
<link rel="stylesheet" href="../dashboard-v5/styles/tokens.css" />
<style>
  /* Satellites design · "quick-run · ctrl alt x". The window is 580×442,
     transparent and frameless (main.js openCastPalette); the card sits inside it
     with room for its shadow and grows with its rows. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  body { font-family: var(--term); color: var(--text); font-size: 13px; padding: 8px 10px 22px; }

  #pal {
    display: flex; flex-direction: column; max-height: 100%;
    background: var(--card-hi); border: 1px solid var(--gold); border-radius: 14px;
    box-shadow: 0 14px 30px rgba(0, 0, 0, .45); overflow: hidden;
  }
  .inbox { padding: 12px; flex: none; }
  .field {
    height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    border-radius: 8px; background: var(--ink); border: 1px solid var(--frame); font-size: 15px;
  }
  .field:focus-within { border-color: var(--frame-hi); }
  .pr { color: var(--gold); }
  input {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
    color: var(--text); font: inherit; caret-color: var(--gold);
  }
  input::placeholder { color: var(--faint); }

  #list { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 12px; padding: 9px 14px; color: var(--muted); cursor: pointer; }
  .row:hover { color: var(--text); }
  .row.sel { color: var(--text); background: color-mix(in oklab, var(--gold) 10%, transparent); box-shadow: inset 2px 0 0 var(--gold); }
  .ic { width: 20px; text-align: center; flex: none; }
  .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pips { font-size: 7px; letter-spacing: 1px; color: var(--faint); flex: none; }
  .meta { font-size: 11px; white-space: nowrap; flex: none; }
  .meta.green { color: var(--green); } .meta.red { color: var(--red); }
  .meta.muted { color: var(--muted); } .meta.faint { color: var(--faint); }
  #empty { color: var(--faint); font-size: 12px; padding: 14px; text-align: center; }

  .msg { margin: 6px 12px 0; padding: 7px 10px; border-radius: 8px; font-size: 12px; line-height: 1.35; word-break: break-word; flex: none; }
  .msg.red { color: var(--red); background: color-mix(in oklab, var(--red) 10%, transparent); border: 1px solid color-mix(in oklab, var(--red) 45%, transparent); }

  #confirm { margin: 8px 12px 0; padding: 10px 12px; border-radius: 8px; background: var(--ink); border: 1px solid var(--gold); font-size: 12px; flex: none; }
  #confirm .why { color: var(--accent-text); font-size: 11px; margin-bottom: 5px; }
  #confirm .cmd { color: var(--text); word-break: break-all; max-height: 64px; overflow-y: auto; }
  #confirm .cwd { color: var(--faint); font-size: 11px; margin-top: 4px; word-break: break-all; }
  #confirm .cwd:empty { display: none; }
  #confirm .keys { color: var(--faint); font-size: 11px; margin-top: 6px; }

  .foot { display: flex; gap: 10px; margin-top: 8px; padding: 8px 14px; border-top: 1px solid var(--frame); font-size: 11px; color: var(--faint); flex: none; }
  .foot #stat { flex: 1; text-align: right; color: var(--orange); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .foot #stat:empty { display: none; }
</style>
</head>
<body>
  <div id="pal">
    <div class="inbox">
      <label class="field"><span class="pr" aria-hidden="true">›</span><input id="q" autofocus spellcheck="false" autocomplete="off" aria-label="Spell to run" aria-controls="list" placeholder="run… (empty = favourites & recent)" /></label>
    </div>
    <div id="list" role="listbox" aria-label="Spells"></div>
    <div id="empty" hidden>no matching spells</div>
    <div id="msg" class="msg red" role="alert" hidden></div>
    <div id="confirm" hidden><div class="why"></div><div class="cmd"></div><div class="cwd"></div><div class="keys">enter again → run it · esc → back</div></div>
    <div class="foot"><span>↑↓ choose · enter → run · esc close</span><span id="stat"></span></div>
  </div>
  <script src="./cast.js"></script>
</body>
</html>
