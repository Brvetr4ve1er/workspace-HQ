<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cast</title>
<style>
  :root { --bg0:#0c0a1e; --bg1:#14102e; --line:#2a2350; --cyan:#00f0ff; --gold:#ffd23f; --green:#3aff6e;
          --red:#ff4757; --txt:#e7e3ff; --muted:#9690c4; --faint:#5e588a;
          --mono: ui-monospace, "Cascadia Code", Consolas, monospace; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:transparent; overflow:hidden; user-select:none; }
  #pal { height:100vh; display:flex; flex-direction:column; padding:12px 14px; border:1px solid var(--line); border-radius:12px;
         background: radial-gradient(120% 140% at 0% 0%, rgba(255,210,63,.10), transparent 60%),
                     linear-gradient(160deg, var(--bg1), var(--bg0));
         box-shadow:0 12px 34px rgba(0,0,0,.65); font-family:var(--mono); color:var(--txt); }
  .lbl { font-size:9px; letter-spacing:.6px; color:var(--gold); text-transform:uppercase; margin-bottom:7px; }
  .lbl b { color:var(--faint); float:right; }
  input { width:100%; background:#0a081c; border:1px solid var(--line); border-radius:7px;
          color:var(--txt); font-family:var(--mono); font-size:15px; padding:9px 12px; outline:none; }
  input:focus { border-color:var(--gold); box-shadow:0 0 0 2px rgba(255,210,63,.15); }
  input::placeholder { color:var(--faint); }
  #list { flex:1; overflow-y:auto; margin-top:8px; }
  .row { display:flex; align-items:center; gap:9px; padding:6px 9px; border-radius:7px; cursor:pointer;
         border-left:3px solid var(--sch, var(--line)); margin-bottom:2px; }
  .row.sel { background:rgba(255,255,255,.06); box-shadow:inset 0 0 0 1px var(--sch, var(--line)); }
  .ic { font-size:15px; width:20px; text-align:center; }
  .nm { flex:1; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta { font-size:9px; color:var(--faint); white-space:nowrap; }
  .pips { font-size:8px; color:var(--gold); letter-spacing:1px; }
  .r-rare .nm { color:#9fc4ff; } .r-epic .nm { color:#d3a4ff; } .r-legendary .nm { color:var(--gold); }
  #confirm { display:none; margin-top:8px; padding:8px 10px; background:#000; border:1px solid var(--gold);
             border-radius:7px; font-size:11px; }
  #confirm.on { display:block; }
  #confirm .why { color:var(--gold); font-size:10px; margin-bottom:5px; }
  #confirm .cmd { color:var(--green); word-break:break-all; max-height:64px; overflow-y:auto; }
  #confirm .keys { color:var(--faint); font-size:9px; margin-top:5px; }
  #empty { color:var(--faint); font-size:12px; text-align:center; margin-top:24px; }
</style>
</head>
<body>
  <div id="pal">
    <div class="lbl">⚡ quick cast <b>↑↓ choose · Enter cast · Esc close</b></div>
    <input id="q" autofocus placeholder="spell name… (empty = favorites & recent)" />
    <div id="list"></div>
    <div id="empty" hidden>no matching spells</div>
    <div id="confirm"><div class="why"></div><div class="cmd"></div><div class="keys">Enter again = cast it · Esc = back</div></div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const SCH = { divination:'#00f0ff', conjuration:'#ffd23f', transmutation:'#ffa502', abjuration:'#4d9fff',
                  evocation:'#ff4757', illusion:'#ff2bd6', enchantment:'#b14aff', restoration:'#3aff6e' };
    let spells = [], tele = { favorites: [], rollup: {} }, hits = [], sel = 0, pending = null;

    const ago = (iso) => {
      if (!iso) return '';
      const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
      return m < 60 ? m + 'm' : m < 1440 ? Math.round(m / 60) + 'h' : Math.round(m / 1440) + 'd';
    };
    const pipCount = (id) => {
      const d = tele.rollup[id]?.distinct_days || 0;
      return [1, 5, 15, 40, 100].filter((x) => d >= x).length;
    };

    function rank(s, q) {
      const n = s.name.toLowerCase(), i = s.id.toLowerCase();
      if (n.startsWith(q)) return 0;
      if (n.includes(q)) return 1;
      if (i.includes(q) || (s.school || '').includes(q)) return 2;
      return -1;
    }
    function filter() {
      const q = $('q').value.trim().toLowerCase();
      if (!q) {
        const fav = tele.favorites.map((id) => spells.find((s) => s.id === id)).filter(Boolean);
        const rec = spells.filter((s) => tele.rollup[s.id]?.last_cast)
          .sort((a, b) => (tele.rollup[b.id].last_cast || '').localeCompare(tele.rollup[a.id].last_cast || ''));
        hits = [...new Set([...fav, ...rec, ...spells.filter((s) => s.source === 'grimoire')])].slice(0, 12);
      } else {
        hits = spells.map((s) => [rank(s, q), s]).filter(([r]) => r >= 0)
          .sort((a, b) => a[0] - b[0]).slice(0, 12).map(([, s]) => s);
      }
      sel = 0; pending = null; $('confirm').className = '';
      draw();
    }
    function draw() {
      const L = $('list'); L.innerHTML = '';
      $('empty').hidden = hits.length > 0;
      hits.forEach((s, i) => {
        const r = document.createElement('div');
        r.className = `row r-${s.rarity}` + (i === sel ? ' sel' : '');
        r.style.setProperty('--sch', SCH[s.school] || '#2a2350');
        // names/icons come from third-party skill frontmatter — textContent only
        const mk = (cls, text) => { const sp = document.createElement('span'); sp.className = cls; sp.textContent = text; return sp; };
        r.appendChild(mk('ic', s.icon || '✴️'));
        r.appendChild(mk('nm', s.name));
        const p = pipCount(s.id);
        if (p) r.appendChild(mk('pips', '●'.repeat(p)));
        r.appendChild(mk('meta', (s.kind === 'channeled' ? '⚡ ' : '') + (ago(tele.rollup[s.id]?.last_cast) || s.rarity)));
        r.onclick = () => { sel = i; draw(); cast(); };
        L.appendChild(r);
      });
    }
    async function cast() {
      const s = hits[sel]; if (!s) return;
      const hash = pending && pending.id === s.id ? pending.content_hash : undefined;
      const res = await window.hq.castSpell(s.id, hash, { notify: true });
      if (!res) return;
      if (res.confirm_required) {
        pending = res.preview;
        const c = $('confirm');
        c.querySelector('.why').textContent = (pending.changed ? '⚠ spell changed since last approval — ' : 'first cast — ') + 'it will run exactly:';
        c.querySelector('.cmd').textContent = [pending.command, ...(pending.args || [])].join(' ');
        c.className = 'on';
        return;
      }
      window.hq.hideCastPalette();   // fire-and-forget; outcome arrives as a notification
    }
    $('q').addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, hits.length - 1); pending = null; $('confirm').className = ''; draw(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); pending = null; $('confirm').className = ''; draw(); e.preventDefault(); }
      else if (e.key === 'Enter') cast();
      else if (e.key === 'Escape') { if (pending) { pending = null; $('confirm').className = ''; } else window.hq.hideCastPalette(); }
    });
    $('q').addEventListener('input', filter);
    (async () => {
      const book = await window.hq.getSpellbook();
      tele = (await window.hq.getSpellTelemetry()) || tele;
      spells = (book?.spells || []).filter((s) => !s.invalid && (s.kind === 'castable' || s.kind === 'channeled' || s.kind === 'chain'));
      filter();
      $('q').focus();
    })();
    window.addEventListener('DOMContentLoaded', () => $('q').focus());
  </script>
</body>
</html>
