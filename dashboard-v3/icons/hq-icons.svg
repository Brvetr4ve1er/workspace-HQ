<?xml version="1.0" encoding="UTF-8"?>
<!--
  WorkspaceHQ v3 · Icon Sprite
  ────────────────────────────────────────────────────────────────────────
  28 symbols in one file. Amber-nexus register: line icons on a 24×24 grid,
  stroke="currentColor" so the parent CSS colours them (rail dim → active
  amber). Optional fills use currentColor at reduced opacity so severity
  and hover treatments propagate without a repaint.
  Referenced from HTML via <svg><use href="hq-icons.svg#i-<name>"/></svg>
  OR from JS via the icon(name) helper in dashboard-v3/src/ui/icons.js,
  which inlines the sprite into <body> at boot so cross-file <use> works
  under file:// without CSP quirks.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true">
  <defs>
    <style>
      /* Every symbol composes these — kept out of individual paths for readability.
         `.f` fills the current colour at 12% for interior glyph accents that must
         read at rail size without competing with the outline. */
      symbol { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      symbol .f { fill: currentColor; stroke: none; }
      symbol .fw { fill: currentColor; fill-opacity: .16; stroke: none; }
      symbol .accent { stroke: #f5a623; }
    </style>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════════════
       REALMS (16)
       ═══════════════════════════════════════════════════════════════════ -->

