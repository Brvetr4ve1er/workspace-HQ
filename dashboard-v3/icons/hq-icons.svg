  <!-- ═══════════════════════════════════════════════════════════════════
       BRAND (2)
       ═══════════════════════════════════════════════════════════════════ -->

  <!-- Wordmark — WORKSPACE HQ typographic, monospace, brackets echo the HUD.
       Rendered as paths so it doesn't depend on VT323 being loaded. -->
  <symbol id="i-brand-wordmark" viewBox="0 0 240 32">
    <path d="M8 8v16" stroke-width="2"/>
    <path d="M14 8v16" stroke-width="2"/>
    <!-- WORKSPACE — geometric monoline capitals -->
    <g font-family="ui-monospace, 'Cascadia Mono', 'Consolas', monospace" font-size="18" font-weight="700" letter-spacing="2" class="f">
      <text x="24" y="22">WORKSPACE</text>
    </g>
    <!-- HQ chip -->
    <path d="M172 6h58a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2h-58a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" class="accent"/>
    <g font-family="ui-monospace, 'Cascadia Mono', 'Consolas', monospace" font-size="16" font-weight="700" letter-spacing="4" class="f">
      <text x="184" y="21">HQ</text>
    </g>
    <path d="M226 8v16" stroke-width="2" class="accent"/>
    <path d="M232 8v16" stroke-width="2" class="accent"/>
  </symbol>

  <!-- App mark — nested hexagons with a central amber dot. Distinctive at 16 px
       (the outer frame reads as a hex, the amber core reads as a warm dot), and
       at 256 px reveals the nested-hex HUD language shared with the level coin.
       Ink ground is baked in so the favicon is legible on any background. -->
  <symbol id="i-brand-app" viewBox="0 0 48 48">
    <!-- inner amber background — the "chip" -->
    <path d="m24 3 18 10.5v21L24 45 6 34.5v-21z" fill="#f5a623"/>
    <!-- outer hex highlight -->
    <path d="m24 3 18 10.5v21L24 45 6 34.5v-21z" fill="none" stroke="#e6c34a" stroke-width="1.4"/>
    <!-- ink nested-hex geometry (renders as ink on the amber ground; deliberately
         does not use currentColor so it stays legible independent of the parent
         colour that the sprite's <style> block otherwise cascades through). -->
    <path d="m24 8 14 8v16l-14 8-14-8V16z" fill="none" stroke="#0a0812" stroke-width="1.6"/>
    <path d="m24 13 9.5 5.5v11L24 35l-9.5-5.5v-11z" fill="none" stroke="#0a0812" stroke-width="1.2" opacity=".55"/>
    <!-- central dot — the "hub" -->
    <circle cx="24" cy="24" r="2.6" fill="#0a0812"/>
    <circle cx="24" cy="24" r="1.1" fill="#f5a623"/>
  </symbol>

  <!-- Level coin — hexagon ring around a numeric slot. CSS positions the number
       on top; this symbol is the frame only. Two overlaid hexes = double-ring HUD. -->
  <symbol id="i-brand-level-coin" viewBox="0 0 48 48">
    <path d="m24 3 18 10.5v21L24 45 6 34.5v-21z" stroke-width="2"/>
    <path d="m24 8 14 8v16l-14 8-14-8V16z" stroke-width="1" opacity=".6"/>
    <path d="m24 12 10 6v12l-10 6-10-6V18z" stroke-width="1" opacity=".25"/>
  </symbol>


