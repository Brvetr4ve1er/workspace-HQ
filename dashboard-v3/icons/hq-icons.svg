    <path class="fw" d="M9.6 15.5c0 2.6 1.1 3.7 2.4 3.7s2.4-1.1 2.4-3.7c0-1.6-.7-2.7-1.4-3.3-.4.9-1 1.4-1.5 1.4-.5 0-1.1-.3-1.9-1.1z"/>
