<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- no eval, no remote origins; unsafe-inline styles allowed because views
       set style attributes (same trade v3/index.html + shard.html make) -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>WorkspaceHQ — v4</title>
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/shell.css" />
  <!-- Phase C: the shared component language, then the WORK workbench layout.
       Order matters — work.css composes the components, never redefines them. -->
  <link rel="stylesheet" href="./styles/components.css" />
  <link rel="stylesheet" href="./styles/work.css" />
  <!-- v4.1 surfaces. work.css stays FIRST of the surface sheets: the PROJECTS
       drawer composes its .drawer*/.truth-kv/.meter classes rather than
       redefining them (S1's "promote into components.css" ask is declined —
       work.css is loaded document-wide, so the classes already resolve and a
       move would be churn with no behaviour change). system.css and
       lookback.css ALSO self-inject from their views; these static links win
       the race and their injectors then no-op. -->
  <link rel="stylesheet" href="./styles/projects.css" />
  <link rel="stylesheet" href="./styles/system.css" />
  <link rel="stylesheet" href="./styles/mind.css" />
  <link rel="stylesheet" href="./styles/automate.css" />
  <link rel="stylesheet" href="./styles/lookback.css" />
</head>
<body>
  <!-- scanline atmosphere (pure CSS, pointer-events none) -->
  <div id="scan-atmo" aria-hidden="true"></div>

  <div id="v4">
    <aside id="rail" aria-label="surfaces"></aside>
    <div id="stage-wrap">
      <header id="topstrip"></header>
      <main id="stage"></main>
    </div>
  </div>

  <!-- overlay layer: the command palette builds itself in here on first open
       (above #v4, outside the stage so a surface re-mount never disturbs it) -->
  <div id="overlays"></div>

  <!-- the v2 data bundle, read-only (window.DATA) — same seam v3 uses -->
  <script src="../dashboard/data.js"></script>
  <!-- ESM boot: nested relative module imports over file:// (proven in v3) -->
  <script type="module" src="./src/core/boot.js"></script>
</body>
</html>
